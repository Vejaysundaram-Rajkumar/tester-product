<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building with FPP Navigation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #chart-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            display: none;
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <canvas id="chart"></canvas>
    </div>

    <!-- Include Three.js and Pointer Lock Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0, 10, 10).normalize();
        scene.add(light);

        // Create Building (Cube representing a floor)
        const floorHeight = 20;
        const floors = [];

        for (let i = 0; i < 3; i++) {  // Three floors for the building
            const floorGeometry = new THREE.BoxGeometry(50, floorHeight, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x808080, wireframe: false });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.position.set(0, i * floorHeight, 0);  // Stack floors
            scene.add(floor);
            floors.push(floor);
        }

        // Projector (Simple Plane for showing charts)
        const projectorGeometry = new THREE.PlaneGeometry(20, 15);
        const projectorMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const projectors = [];

        for (let i = 0; i < 3; i++) {
            const projector = new THREE.Mesh(projectorGeometry, projectorMaterial);
            projector.position.set(0, i * floorHeight + 5, -24);  // Position in front of each floor
            scene.add(projector);
            projectors.push(projector);
        }

        // Set Camera initial position (start at ground floor)
        camera.position.set(0, 10, 50);
        
        // First-person movement using Pointer Lock Controls
        const controls = new THREE.PointerLockControls(camera, document.body);

        document.addEventListener('click', () => {
            controls.lock();  // Click to lock the pointer (start FPP)
        });

        // Floor interaction (Displaying chart on each floor when standing in front of projector)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Handle movement in first-person perspective
        const moveSpeed = 0.1;
        const velocity = new THREE.Vector3();

        let canJump = false;

        const onKeyDown = (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    velocity.z = -moveSpeed;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    velocity.z = moveSpeed;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    velocity.x = -moveSpeed;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    velocity.x = moveSpeed;
                    break;
                case 'Space':  // Jump between floors
                    if (canJump) {
                        camera.position.y += floorHeight;
                        canJump = false;
                    }
                    break;
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW':
                case 'ArrowDown':
                case 'KeyS':
                    velocity.z = 0;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                case 'ArrowRight':
                case 'KeyD':
                    velocity.x = 0;
                    break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // Function to show chart when user is in front of a projector
        function checkProjectorIntersection() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(projectors);

            if (intersects.length > 0) {
                const floorIndex = projectors.indexOf(intersects[0].object);
                showMetricChart(floorIndex + 1);
            } else {
                document.getElementById('chart-container').style.display = 'none';
            }
        }

        // Display chart using Chart.js
        function showMetricChart(floorNumber) {
            const chartContainer = document.getElementById('chart-container');
            chartContainer.style.display = 'block';

            const ctx = document.getElementById('chart').getContext('2d');
            const data = {
                labels: ['Target', 'Outcome'],
                datasets: [{
                    label: `Metrics for Floor ${floorNumber}`,
                    data: [Math.random() * 100, Math.random() * 100],  // Replace with actual metric data
                    backgroundColor: ['rgba(255, 99, 132, 0.2)', 'rgba(54, 162, 235, 0.2)'],
                    borderColor: ['rgba(255, 99, 132, 1)', 'rgba(54, 162, 235, 1)'],
                    borderWidth: 1
                }]
            };

            new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Main animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Move camera
            controls.moveRight(velocity.x);
            controls.moveForward(velocity.z);

            // Check for intersection with projector
            checkProjectorIntersection();

            renderer.render(scene, camera);
        }

        animate();

        // Handle resizing
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
